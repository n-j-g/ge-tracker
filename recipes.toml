# Production recipes: any number of tradable inputs -> any number of outputs.
#
#   name    - unique label for the action
#   skill   - skill the XP goes to
#   xp      - XP gained per action
#   inputs  - item name = quantity consumed per action
#   outputs - item name = quantity produced per action
#
# Item names must match the GE names on the OSRS Wiki exactly (case-insensitive).
# Quantities may be fractional (e.g. Thread is used up once per 5 crafts = 0.2).
# Use "Coins" for flat gp costs such as NPC fees.
# Values are per single action; burns/failures are ignored in this MVP.

# Outputs that are rare or chance-based by-products, not a guaranteed result of
# the action. The Wiki lists these as recipes, so any recipe producing one of
# these is ignored. Add names here as you find them (case-insensitive).
exclude_outputs = [
  "Squid beak",  # 1/1,024 or 1/512 chance when cutting squid
]

# Hand-set production speeds (actions per hour), by recipe name as shown on the
# results page. These replace the estimate from Wiki ticks + banking. Useful for
# runecrafting (travel-bound, so it has no estimate by default) or anything
# whose estimate you know is off. Example:
#   "Blood rune" = 4000
[actions_per_hour]
# Blast Furnace: the inventory + bank model doesn't fit (coal bag, conveyor belt).
# Bars/hour from the Wiki money making guides (200 trips/hr, coal bag, stamina):
# https://oldschool.runescape.wiki/w/Money_making_guide/Smelting_runite_bars_at_Blast_Furnace
"Runite bar (Blast Furnace)" = 2160
"Adamantite bar (Blast Furnace)" = 2700
"Mithril bar (Blast Furnace)" = 3600
"Steel bar (Blast Furnace)" = 5400
"Iron bar (Blast Furnace)" = 6000

# Running costs that are charged per hour rather than per item, by recipe name.
# Spread over the recipe's actions/hour and added to its cost.
[coins_per_hour]
# Blast Furnace coffer: 1,200 coins per minute on official Blast Furnace worlds.
"Runite bar (Blast Furnace)" = 72000
"Adamantite bar (Blast Furnace)" = 72000
"Mithril bar (Blast Furnace)" = 72000
"Steel bar (Blast Furnace)" = 72000
"Iron bar (Blast Furnace)" = 72000

# The method you'd normally train each skill with (a recipe name as shown on the
# results page). Each recipe's "XP pace" compares its XP/hr to this method's, so
# you can see how much training speed you give up for the gp. Skills not listed
# show no pace.
[normal_training]
Fletching = "String magic longbow"
Herblore = "Make saradomin brew(3)"
Cooking = "Cook anglerfish"
Crafting = "Black d'hide body (Needle)"
Smithing = "Smith rune platebody"
Magic = "Red dragon leather (Tan leather spell)"

